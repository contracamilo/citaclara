# Puertas de merge de la constitución: suite completa en verde (4), trazabilidad spec ↔ tests (2)
# y pruebas de solape sobre PostgreSQL real (3).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trazabilidad:
    name: Trazabilidad spec ↔ tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/trazabilidad.sh
      - run: ./scripts/trazabilidad.sh specs/004-panel-analitica

  seguridad:
    name: Seguridad (dependencias y secretos)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Dependencias vulnerables (OSV-Scanner)
        # Falla ante cualquier vulnerabilidad conocida (umbral más estricto que «alta o crítica»).
        # Limitación: no resuelve las versiones que gestiona el BOM de Spring Boot, así que la
        # cobertura de Maven es parcial (informe de la 005, H-13).
        run: >
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.1
          scan source -L /src/frontend/package-lock.json -L /src/backend/pom.xml
      - name: Secretos en el historial (gitleaks)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose .

  backend:
    name: Backend (JUnit + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Pruebas (incluye solapes y altas simultáneas sobre PostgreSQL 18)
        run: ./mvnw -B verify
      - name: Informes de pruebas
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: informes-backend
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend (tipos, build y Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Comprobación de tipos y build
        run: npm run build
      - name: Pruebas unitarias y de componentes
        run: npm test

  e2e:
    name: Extremo a extremo (Playwright + axe)
    runs-on: ubuntu-latest
    needs: [backend, frontend, seguridad]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Levantar el entorno completo
        run: docker compose up -d --build --wait
      - name: Dependencias y navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Pruebas extremo a extremo (portátil y 360 px; recarga la semilla)
        working-directory: frontend
        env:
          URL_BASE: http://localhost:8080
        run: npm run e2e
      - name: Registros del entorno
        if: failure()
        run: docker compose logs --no-color
      - name: Trazas de Playwright
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trazas-e2e
          path: frontend/test-results/
      - name: Apagar el entorno
        if: always()
        run: docker compose down -v
