# Puertas de merge de la constitución: suite completa en verde (4), trazabilidad spec ↔ tests (2)
# y pruebas de solape sobre PostgreSQL real (3).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trazabilidad:
    name: Trazabilidad spec ↔ tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/trazabilidad.sh

  backend:
    name: Backend (JUnit + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Pruebas (incluye solapes y altas simultáneas sobre PostgreSQL 18)
        run: ./mvnw -B verify
      - name: Informes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-backend
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend (tipos, build y Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Comprobación de tipos y build
        run: npm run build
      - name: Pruebas unitarias y de componentes
        run: npm test

  e2e:
    name: Extremo a extremo (Playwright + axe)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Levantar el entorno completo
        run: docker compose up -d --build --wait
      - name: Dependencias y navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Pruebas extremo a extremo (portátil y 360 px; recarga la semilla)
        working-directory: frontend
        env:
          URL_BASE: http://localhost:8080
        run: npm run e2e
      - name: Registros del entorno
        if: failure()
        run: docker compose logs --no-color
      - name: Trazas de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trazas-e2e
          path: frontend/test-results/
      - name: Apagar el entorno
        if: always()
        run: docker compose down -v
