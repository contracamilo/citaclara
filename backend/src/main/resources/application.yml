spring:
  application:
    name: citaclara
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/citaclara}
    username: ${DB_USUARIO:citaclara}
    password: ${DB_CLAVE:citaclara}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Portal del paciente (002, research R2): SMTP del enlace de acceso. En local y e2e es Mailpit.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PUERTO:1025}
    username: ${SMTP_USUARIO:}
    password: ${SMTP_CLAVE:}
  jackson:
    time-zone: UTC

server:
  port: ${PUERTO:8080}
  servlet:
    session:
      # FR-002 / research D6: la caducidad real es absoluta (8 h desde el acceso) y la controla
      # InterceptorSesion; la inactividad del contenedor no debe caducar antes.
      timeout: 8h
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SEGURA:false}
        name: CITACLARA_SESION

logging:
  level:
    # Spec 005 (H-03): el mensaje de PostgreSQL ante una violación de restricción incluye los valores
    # en conflicto (p. ej. el teléfono de un paciente); no debe llegar a los registros. El error se
    # traduce y se registra, sin valores, en ManejadorErrores.
    "[org.hibernate.orm.jdbc.error]": "OFF"
    "[org.hibernate.engine.jdbc.spi.SqlExceptionHelper]": "OFF"

citaclara:
  # 002, research R2 y R13: remitente de los correos y URL pública de los enlaces de acceso
  # (nunca se toma de la cabecera Host).
  email-remitente: ${EMAIL_REMITENTE:citas@citaclara.local}
  url-publica: ${URL_PUBLICA:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: semilla
  main:
    web-application-type: none

---
# Spec 005 (H-05, H-06): sin valores por defecto de desarrollo; ValidacionProduccion los comprueba.
spring:
  config:
    activate:
      on-profile: produccion
  datasource:
    password: ${DB_CLAVE}
server:
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SEGURA:true}
