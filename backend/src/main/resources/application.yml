spring:
  application:
    name: citaclara
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/citaclara}
    username: ${DB_USUARIO:citaclara}
    password: ${DB_CLAVE:citaclara}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  port: ${PUERTO:8080}
  servlet:
    session:
      # FR-002 / research D6: la caducidad real es absoluta (8 h desde el acceso) y la controla
      # InterceptorSesion; la inactividad del contenedor no debe caducar antes.
      timeout: 8h
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SEGURA:false}
        name: CITACLARA_SESION

logging:
  level:
    # Spec 005 (H-03): el mensaje de PostgreSQL ante una violación de restricción incluye los valores
    # en conflicto (p. ej. el teléfono de un paciente); no debe llegar a los registros. El error se
    # traduce y se registra, sin valores, en ManejadorErrores.
    "[org.hibernate.orm.jdbc.error]": "OFF"
    "[org.hibernate.engine.jdbc.spi.SqlExceptionHelper]": "OFF"

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: semilla
  main:
    web-application-type: none
