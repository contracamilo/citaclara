# Spec 005 (H-16): límites de peticiones por origen (rate limiting).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=acceso:10m rate=60r/m;
limit_req_status 429;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 64k;
    server_name _;
    root /usr/share/nginx/html;

    # DNS interno de Docker: «api» se resuelve en cada petición, así nginx arranca
    # aunque el backend aún no exista (y sigue funcionando si se recrea).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: mismo origen; se conservan cabeceras y cookies de sesión.
    # Con variable y sin URI, proxy_pass reenvía la URI original (/api/...) tal cual.
    # Ruta de acceso: más estricta (60 por minuto con ráfaga de 20: la batería e2e inicia sesión decenas de veces; el límite estricto por intentos fallidos es S-001). Va antes que /api/.
    location ~ ^/api/clinicas/[^/]+/sesion$ {
        limit_req zone=acceso burst=20 nodelay;
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-store" always;
        set $api_acceso http://api:8080;
        proxy_pass $api_acceso;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-store" always;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # Estáticos con hash en el nombre: caché larga.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html nunca se cachea.
    location = /index.html {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-cache";
    }

    # Cualquier otra ruta (/, /{identificador}) cae en index.html.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-cache";
    }
}
