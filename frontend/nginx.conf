server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # DNS interno de Docker: «api» se resuelve en cada petición, así nginx arranca
    # aunque el backend aún no exista (y sigue funcionando si se recrea).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: mismo origen; se conservan cabeceras y cookies de sesión.
    # Con variable y sin URI, proxy_pass reenvía la URI original (/api/...) tal cual.
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # Estáticos con hash en el nombre: caché larga.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html nunca se cachea.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cualquier otra ruta (/, /{identificador}) cae en index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
